# Form 8-K item codes and their SEC item titles.
#
# `items` are the current items (effective August 23, 2004), taken verbatim
# from the General Instructions of Form 8-K on sec.gov, section "Item 1.01
# ... Item 9.01" (retrieved 2026-10-17):
#   https://www.sec.gov/files/form8-k.pdf
#
# `legacy` are the pre-August-2004 single-number items. Their titles were read
# from the item headings of actual filings in the SEC Archives with a
# pre-2004-08-23 filing date, for example:
#   Item 1:  https://www.sec.gov/Archives/edgar/data/1022962/000102296201500009/eight-k.htm
#   Item 3:  https://www.sec.gov/Archives/edgar/data/1135185/000095013404000956/d12305awe8vk.htm
#   Item 6:  https://www.sec.gov/Archives/edgar/data/1109448/000091205701512440/a2047501z8-k.htm
#   Item 8:  https://www.sec.gov/Archives/edgar/data/95052/000009505204000046/form_8k.txt
#   Item 11: https://www.sec.gov/Archives/edgar/data/34151/000095015204004468/l07967ae8vk.htm
# Note: the `items` field of pre-2004 filings is unreliable -- for many
# filings it disagrees with the filing body (for example WFC
# 0000072971-96-000098 is tagged "1" but reports Items 5 and 7, and JNJ
# 0000200406-01-500009 is tagged "6" but reports Item 5), so these labels
# describe the codes as received rather than the events the filing reported.
# Before 2001 some filings used the shorter legacy title "Financial Statements
# and Exhibits" for item 7.

