# Canonical fundamentals fields (decision S-8). Rank is position in each
# ordered list: rank 1 is the field's preferred concept for that taxonomy.
#
# kind: duration | instant
# unit_family: currency | shares | currency_per_share
#
# Ranks were set from issuer evidence, not from a few fixtures: the annual
# facts of every issuer in config/universe.csv were collected with
# tools/concept_evidence.py (2026-10) and each choice below that is not
# self-evident names the issuers that needed it.
fields:
  revenue:
    kind: duration
    unit_family: currency
    # Total revenue first (decision A-18). Contract revenue is a component
    # for banks (JPM, BAC tag only Revenues; WFC tags only its total net
    # revenue, RevenuesNetOfInterestExpense) and for energy and retail
    # issuers: ENB FY2025 Revenues 65,194,000,000 CAD vs contract revenue
    # 29,329,000,000, and TRP, CVX, CP and WMT show the same gap.
    us-gaap:
      - Revenues
      - RevenuesNetOfInterestExpense
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - SalesRevenueNet
    # `Revenue` is the IFRS total for the Canadian banks (RY, TD, BNS, BMO,
    # CM) and the energy and rail issuers; SU, NTR and TECK report only
    # RevenueFromContractsWithCustomers. MFC tags only its fee/other revenue
    # as Revenue: IFRS 17 insurers tag no single total-revenue element, so
    # revenue inherits that gap for insurers and QA reports coverage.
    ifrs-full:
      - Revenue
      - RevenueFromContractsWithCustomers

  gross_profit:
    kind: duration
    unit_family: currency
    us-gaap:
      - GrossProfit
    ifrs-full:
      - GrossProfit

  operating_income:
    kind: duration
    unit_family: currency
    us-gaap:
      - OperatingIncomeLoss
    ifrs-full:
      - ProfitLossFromOperatingActivities

  net_income:
    kind: duration
    unit_family: currency
    us-gaap:
      - NetIncomeLoss
      - ProfitLoss
    ifrs-full:
      - ProfitLoss
      - ProfitLossAttributableToOwnersOfParent

  income_before_tax:
    kind: duration
    unit_family: currency
    us-gaap:
      - IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
    ifrs-full:
      - ProfitLossBeforeTax

  eps_basic:
    kind: duration
    unit_family: currency_per_share
    us-gaap:
      - EarningsPerShareBasic
      - IncomeLossFromContinuingOperationsPerBasicShare
    ifrs-full:
      - BasicEarningsLossPerShare

  eps_diluted:
    kind: duration
    unit_family: currency_per_share
    us-gaap:
      - EarningsPerShareDiluted
      - IncomeLossFromContinuingOperationsPerDilutedShare
    ifrs-full:
      - DilutedEarningsLossPerShare

  research_and_development_expense:
    kind: duration
    unit_family: currency
    us-gaap:
      - ResearchAndDevelopmentExpense
    ifrs-full:
      - ResearchAndDevelopmentExpense

  operating_cash_flow:
    kind: duration
    unit_family: currency
    us-gaap:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
    ifrs-full:
      - CashFlowsFromUsedInOperatingActivities

  capex:
    kind: duration
    unit_family: currency
    us-gaap:
      - PaymentsToAcquirePropertyPlantAndEquipment
      - PaymentsToAcquireProductiveAssets
    ifrs-full:
      - PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities

  total_assets:
    kind: instant
    unit_family: currency
    us-gaap:
      - Assets
    ifrs-full:
      - Assets

  current_assets:
    kind: instant
    unit_family: currency
    us-gaap:
      - AssetsCurrent
    ifrs-full:
      - CurrentAssets

  # Narrow cash first; JPM, BAC, WFC, CVX and PG report only the
  # restricted-cash-inclusive total, which is therefore the fallback.
  cash:
    kind: instant
    unit_family: currency
    us-gaap:
      - CashAndCashEquivalentsAtCarryingValue
      - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
    ifrs-full:
      - CashAndCashEquivalents

  inventory:
    kind: instant
    unit_family: currency
    us-gaap:
      - InventoryNet
    ifrs-full:
      - Inventories

  accounts_receivable:
    kind: instant
    unit_family: currency
    us-gaap:
      - AccountsReceivableNetCurrent
      - ReceivablesNetCurrent
      - AccountsAndOtherReceivablesNetCurrent
    ifrs-full:
      - TradeAndOtherReceivables

  total_liabilities:
    kind: instant
    unit_family: currency
    us-gaap:
      - Liabilities
    ifrs-full:
      - Liabilities

  current_liabilities:
    kind: instant
    unit_family: currency
    us-gaap:
      - LiabilitiesCurrent
    ifrs-full:
      - CurrentLiabilities

  # LongTermDebt is the total (current and noncurrent); PG, UNH, V and MA
  # tag only LongTermDebtNoncurrent, and CP, WCN, CVX and KO only
  # LongTermDebtAndCapitalLeaseObligations, so both are fallbacks.
  long_term_debt:
    kind: instant
    unit_family: currency
    us-gaap:
      - LongTermDebt
      - LongTermDebtNoncurrent
      - LongTermDebtAndCapitalLeaseObligations
    ifrs-full:
      - LongtermBorrowings
      - Borrowings

  # StockholdersEquity is the parent's equity; JNJ, PG, UNH and V tag only
  # the NCI-inclusive total, which is the fallback.
  total_equity:
    kind: instant
    unit_family: currency
    us-gaap:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
    ifrs-full:
      - Equity
      - EquityAttributableToOwnersOfParent

  # Most IFRS issuers (RY, BNS, BMO, CM, MFC, SLF, CNQ, SU, CVE, NTR) report
  # shares outstanding only as dei:EntityCommonStockSharesOutstanding, which
  # the map cannot carry, so shares_outstanding stays unmapped for them; TD
  # and TECK report ifrs-full:NumberOfSharesOutstanding. QA reports the
  # coverage gap.
  shares_outstanding:
    kind: instant
    unit_family: shares
    us-gaap:
      - CommonStockSharesOutstanding
      - EntityCommonStockSharesOutstanding
    ifrs-full:
      - NumberOfSharesOutstanding
